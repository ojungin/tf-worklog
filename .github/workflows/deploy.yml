name: Deploy (Supabase + GitHub Pages)

# 필요한 저장소 설정 (Settings → Secrets and variables → Actions)
#   Variables : SUPABASE_PROJECT_REF   (Supabase 프로젝트 REF, 공개 값)
#   Secrets   : SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#               SETUP_TOKEN            (최초 관리자 생성용 암호문구, 관리자 생성 후 삭제)
#   선택 Secret  : ANTHROPIC_API_KEY      (보고서 Claude AI 요약 사용 시. 없으면 요약 버튼 비활성)
#   선택 Variables : TF_CLAUDE_MODEL(기본 claude-sonnet-4-5), TF_EMAIL_DOMAIN, ALLOWED_ORIGIN(커스텀 도메인 사용 시),
#                    DISABLE_SIGNUP=true (Supabase 프로젝트를 TF 전용으로 쓸 때만)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Supabase (DB · 보안정책 · 계정관리 함수)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      API: https://api.supabase.com/v1
    outputs:
      url: ${{ steps.keys.outputs.url }}
      anon: ${{ steps.keys.outputs.anon }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          [ -n "$REF" ] || { echo "::error::Variables에 SUPABASE_PROJECT_REF 를 등록하세요."; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secrets에 SUPABASE_ACCESS_TOKEN 을 등록하세요."; exit 1; }

      - name: Apply database schema
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "apply $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "$API/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/q.json)
            if [ "$code" -ge 300 ]; then echo "::error::$f 적용 실패 (HTTP $code)"; cat /tmp/r.json; echo; exit 1; fi
          done

      - name: Disable public sign-up (optional)
        if: ${{ vars.DISABLE_SIGNUP == 'true' }}
        run: |
          # 이 Supabase 프로젝트를 TF 워크로그 전용으로 쓸 때만 켜세요 (프로젝트 전체 회원가입이 막힙니다)
          curl -fsS -X PATCH "$API/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data '{"disable_signup": true}' > /dev/null

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set function secrets
        env:
          SETUP_TOKEN: ${{ secrets.SETUP_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.TF_CLAUDE_MODEL }}
          TF_EMAIL_DOMAIN: ${{ vars.TF_EMAIL_DOMAIN }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          origin="${ALLOWED_ORIGIN:-https://$(echo "$OWNER" | tr '[:upper:]' '[:lower:]').github.io}"
          args=("TF_EMAIL_DOMAIN=${TF_EMAIL_DOMAIN:-tf-worklog.local}" "TF_ALLOWED_ORIGIN=$origin")
          if [ -n "$SETUP_TOKEN" ]; then
            args+=("TF_SETUP_TOKEN=$SETUP_TOKEN")
          else
            supabase secrets unset TF_SETUP_TOKEN --project-ref "$REF" >/dev/null 2>&1 || true
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            args+=("TF_ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          else
            supabase secrets unset TF_ANTHROPIC_API_KEY --project-ref "$REF" >/dev/null 2>&1 || true
          fi
          if [ -n "$CLAUDE_MODEL" ]; then args+=("TF_CLAUDE_MODEL=$CLAUDE_MODEL"); fi
          supabase secrets set "${args[@]}" --project-ref "$REF"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy admin-users --no-verify-jwt --use-api --project-ref "$REF"
          supabase functions deploy ai-report --no-verify-jwt --use-api --project-ref "$REF"

      - name: Read public API key
        id: keys
        run: |
          keys=$(curl -fsS "$API/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          anon=$(echo "$keys" | jq -r '(map(select(.type=="publishable"))[0].api_key) // (map(select(.name=="anon"))[0].api_key) // empty')
          [ -n "$anon" ] || { echo "::error::공개(anon/publishable) 키를 찾지 못했습니다."; exit 1; }
          echo "url=https://$REF.supabase.co" >> "$GITHUB_OUTPUT"
          echo "anon=$anon" >> "$GITHUB_OUTPUT"

  web:
    name: GitHub Pages (웹앱)
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js
        env:
          SB_URL: ${{ needs.backend.outputs.url }}
          SB_ANON: ${{ needs.backend.outputs.anon }}
          TF_EMAIL_DOMAIN: ${{ vars.TF_EMAIL_DOMAIN }}
        run: |
          node -e '
            const c={url:process.env.SB_URL,anonKey:process.env.SB_ANON,emailDomain:process.env.TF_EMAIL_DOMAIN||"tf-worklog.local"};
            if(!c.url||!c.anonKey){console.error("Supabase 정보가 비어 있습니다");process.exit(1)}
            require("fs").writeFileSync("web/config.js","window.TF_CONFIG = "+JSON.stringify(c,null,2)+";\n");'
          rm -f web/config.example.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
